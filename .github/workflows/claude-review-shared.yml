name: Claude Code Review (Shared)

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      # On a pull request that is closed or merged by the time the review starts,
      # the action opens a new branch and posts a "Create a PR" link whose
      # prefilled body carries a claude.ai URL, so review open pull requests only.
      - name: Check the pull request is still open
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" = OPEN ]; then
            echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pull request #$PR is $state, so it is not reviewed."
          fi

      - name: Run Claude Code Review
        if: steps.pr.outputs.open == 'true'
        uses: anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50 # v1.0.195
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true
          include_fix_links: false

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on bugs, security vulnerabilities,
            and logic errors. Read the actual code before flagging anything.
            Be precise and actionable. False positives waste developer time.

            Provide inline comments for specific issues and a top-level
            comment for overall observations.

            Privacy: Never quote secrets, credentials, API keys, tokens, or
            personally identifiable information in your review comments.
            Flag the issue and its location, but do not reproduce the
            sensitive value in the comment.

            Never include links to claude.ai in any comment, including
            "Fix this" links and "Generated with Claude Code" footers.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
